<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Тренажёр драматурга — DIVINE TRAGEDY</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: #e8e1d5;
      font-family: 'Manrope', sans-serif;
      min-height: 100vh;
    }

    .page {
      max-width: 850px;
      margin: 0 auto;
      padding: 70px 25px 100px;
    }

    nav {
      margin-bottom: 80px;
    }

    nav a {
      color: #8d877e;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    nav a:hover {
      color: #e8e1d5;
    }

    .eyebrow {
      color: #8d877e;
      font-size: 12px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(50px, 8vw, 85px);
      line-height: 0.9;
      font-weight: 600;
      margin-bottom: 25px;
    }

    .intro {
      color: #aaa39a;
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 50px;
    }

    .generator {
      border: 1px solid #292929;
      padding: 40px;
    }

    .result {
      min-height: 130px;
      padding: 25px;
      border: 1px solid #292929;
      margin-bottom: 25px;
      color: #b8b0a4;
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      line-height: 1.7;
    }

    .result:empty::before {
      content: "Здесь появится задание...";
      color: #55514c;
    }

    .button {
      width: 100%;
      background: transparent;
      color: #e8e1d5;
      border: 1px solid #6f6961;
      padding: 16px 20px;
      font-family: 'Manrope', sans-serif;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .button:hover {
      background: #e8e1d5;
      color: #080808;
    }

    .note {
      margin-top: 25px;
      color: #6f6961;
      font-size: 12px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <main class="page">

    <nav>
      <a href="tools.html">← Инструменты</a>
    </nav>

    <div class="eyebrow">DIVINE TRAGEDY / 01</div>

    <h1>Тренажёр<br>драматурга.</h1>

    <p class="intro">
      Случайное сочетание жанра, сеттинга и драматургической
      структуры. Твоя задача — сделать из этого историю.
    </p>

    <section class="generator">

      <div id="result" class="result"></div>

      <button class="button" onclick="generate()">
        Сгенерировать
      </button>

      <p class="note">
        Не ищи идею. Ищи способ заставить работать ту,
        которую тебе выдали.
      </p>

    </section>

  </main>

  <script>

    const settings = [
      "древность",
      "средневековье",
      "новое время",
      "XIX век",
      "XX век",
      "современность",
      "ближайшее будущее",
      "далёкое будущее",
      "вне времени",
      "город",
      "деревня",
      "пустыня",
      "джунгли",
      "лес",
      "горы",
      "корабль / станция",
      "подземелье",
      "замок / особняк",
      "бункер",
      "школа / академия",
      "психбольница",
      "арена / игровое шоу",
      "тюрьма",
      "больница",
      "космос",
      "реализм",
      "альтернативная история",
      "мистика",
      "фэнтези",
      "научная фантастика",
      "киберпанк",
      "посткиберпанк",
      "биопанк",
      "соларпанк",
      "стимпанк",
      "дизельпанк",
      "атомпанк",
      "гримдарк",
      "сказка",
      "мрачная сказка",
      "готика",
      "магический реализм",
      "многомирье",
      "преисподняя",
      "виртуальная реальность",
      "психосеттинг",
      "мифология",
      "апокалипсис",
      "постапокалипсис",
      "дистопия",
      "утопия"
    ];

    const genres = [
      "драма",
      "трагедия",
      "комедия",
      "трагикомедия",
      "мелодрама",
      "романтическая комедия",
      "сатира",
      "экшен",
      "триллер",
      "детектив",
      "криминал",
      "мистерия",
      "политический триллер",
      "психологический триллер",
      "психологическая драма",
      "шпионский жанр",
      "военный",
      "выживание",
      "биография / псевдобиография",
      "роуд-муви",
      "спортивная драма",
      "романтика",
      "повседневность",
      "слайс оф лайф",
      "мюзикл",
      "комедия положений",
      "ситком",
      "пародия",
      "абсурд",
      "сюрреализм",
      "антиутопия",
      "янг-адалт"
    ];

    const structures = [
      "Путь героя по Воглеру",
      "Мономиф",
      "по Уоттсу",
      "по Хармону",
      "по Филду",
      "по Соту",
      "по Гулино",
      "по Августину",
      "по Бостону",
      "по Уайлдеру",
      "по Соркину",
      "по Хичкоку",
      "научный метод",
      "по Дункану",
      "по Уэллсу",
      "по Воннегуту — Золушка",
      "по Воннегуту — Мальчик и девочка",
      "по Воннегуту — Человек в яме",
      "по Воннегуту — От плохого к ужасному",
      "по Фрейтагу",
      "по Снайдеру",
      "по Макки",
      "5 стадий героя",
      "по Сегер",
      "по Труби",
      "Аристотель — О трагедии",
      "Аристотель — Поэтика",
      "по Хейгу",
      "по Йорку",
      "кривая Фихтеана",
      "по Донату",
      "Дзё-ха-кю",
      "Европейский мюзикл",
      "по Проппу",
      "Кишотенкетсу"
    ];

    function getRandomItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function generate() {

      const genre = getRandomItem(genres);
      const setting = getRandomItem(settings);
      const structure = getRandomItem(structures);

      const result =
        "Жанр: <b>" + genre + "</b><br>" +
        "Сеттинг: <b>" + setting + "</b><br>" +
        "Структура: <b>" + structure + "</b>";

      document.getElementById("result").innerHTML = result;
    }

  </script>

</body>
</html>
